<article class="card border-0 shadow-sm review-card mb-3">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <div class="d-flex align-items-center gap-2">
                <span class="review-avatar">{{ authorInitial }}</span>
                <div>
                    <h6 class="mb-0 review-author">{{ review.author }}</h6>
                    <small class="text-muted">Verified buyer</small>
                </div>
            </div>
            <span class="badge rounded-pill bg-warning text-dark review-stars">
                {{ review.stars }} ★
            </span>
        </div>

        <p class="mt-3 mb-0 review-body">
            {{ review.body }}
        </p>
    </div>
</article>
